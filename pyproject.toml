[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-engine"
version = "0.1.0"
description = "A .conf-driven container management CLI using Docker as its initial runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
forge = "forge_engine.cli:main"

[tool.setuptools.packages.find]
include = ["forge_engine*"]
